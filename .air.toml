root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/gemba ./cmd/gemba"
  bin = "./tmp/gemba"
  args_bin = ["serve", "--port", "7666"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "web", "bin", "dist", "node_modules", ".git"]
  delay = 300

[log]
  time = false

[misc]
  clean_on_exit = true
