# Gemba agent-type registry (local).
# Copy of internal/adapter/native/agents/testdata/agents.toml with binary
# pointed at the claude on PATH. Not committed by default — each workspace
# registers its own roster.

[[agent]]
name     = "claude"
binary   = "claude"
args     = []
model    = "claude-opus-4-7"
preamble = "claude_md"
hooks    = "claude_code"

[[agent]]
name             = "codex"
binary           = "gemba-codex-driver"
args             = [
  "--sandbox", "workspace-write",
  "--ask-for-approval", "never",
]
model            = "gpt-5.4-mini"
preamble         = "codex_exec"
hooks            = "none"
interaction_mode = "balanced"
intra_parallel   = true
max_parallel     = 2
