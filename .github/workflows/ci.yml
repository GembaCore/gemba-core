name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} · go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
        # go.mod targets go 1.25; the matrix tracks 1.25 + 1.26 so
        # the toolchain matches `go.mod`'s `go` directive. Older
        # versions trip golangci-lint's "build go version lower than
        # target" guard.
        go: ['1.25', '1.26']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # actions/setup-node@v4 with `cache: pnpm` only restores the pnpm store
      # cache — it does NOT run `pnpm install`. Without this step, web/node_modules
      # is empty and `pnpm lint` fails with "eslint: command not found".
      - name: Install frontend deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install golangci-lint
        # v2.5.0+ is built with go1.25 so it can analyze code whose
        # go.mod targets go 1.25. The previous pin (v1.62.2) was
        # built with go1.23 and tripped the "build go version lower
        # than target" guard at config-load.
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.5.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: make lint
        run: make lint

      - name: make test
        run: make test

      - name: make build
        run: make build
