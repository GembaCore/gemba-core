# golangci-lint config for gemba.
#
# Conservative starter set: keep the noise low while the scaffold is
# young. Tighten in gm-e7.x once the surface stabilises.

run:
  timeout: 3m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - bodyclose
    - gocritic

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: true
  gocritic:
    disabled-checks:
      - ifElseChain
      - singleCaseSwitch

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gocritic
  max-issues-per-linter: 0
  max-same-issues: 0
