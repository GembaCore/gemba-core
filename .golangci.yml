# golangci-lint v2 config for gemba.
#
# Conservative starter set: keep the noise low while the scaffold is
# young. Tighten in gm-e7.x once the surface stabilises.
#
# v2 schema migration (Apr 2026): top-level `version`, `default: none`
# instead of `disable-all: true`, formatters moved to their own
# section, and linter-settings nest under `linters.settings`. Old v1
# config kept failing CI as v2.5.0 (the first golangci-lint built
# with go1.25) was required for our `go 1.25.0` go.mod.

version: "2"

run:
  timeout: 3m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - bodyclose
    - gocritic
    # misspell intentionally NOT enabled — the codebase mixes US
    # and UK English (e.g., "serialise"/"serialize", "cancelled"/
    # "canceled") deliberately, and either locale flag flags hundreds
    # of false positives. Re-enable with an ignore-words list once
    # the codebase converges on a single locale.
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
    errcheck:
      # Skip the idiomatic write-and-forget calls. fmt.Fprintf /
      # Fprintln targeting an os.Stderr / os.Stdout / cmd.OutOrStdout
      # writer can't fail in any way the caller could meaningfully
      # recover from; .Close() inside a deferred close on a read-only
      # handle is a noisy non-issue. These represent ~99% of the
      # surfaced errcheck findings.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
          # Tests use httptest helpers / aren't required to drain
          # response bodies — bodyclose's value is in production code
          # where leaks accumulate.
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
