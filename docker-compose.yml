services:
  gemba:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: local
        COMMIT: local
        DATE: local
    image: gemba-core:local
    ports:
      - "7666:7666"
    volumes:
      - gemba-data:/data
      - .:/work
    environment:
      GEMBA_LISTEN: 0.0.0.0:7666
      GEMBA_AUTH: token
      GEMBA_ORCHESTRATION: none
      GEMBA_BEADS_DIR: /work

volumes:
  gemba-data:
